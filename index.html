<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#126e65"><title>Этажи · Луговой переулок дом 1</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172c3a;background:#f0f4f5;--g:#126e65;--m:#526b78;--l:#cbd9dd}*{box-sizing:border-box}body{margin:0}header{background:#152e3c;color:#fff;padding:20px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:12px}header h1{margin:0;font-size:1.7rem}header p{margin:2px 0 0;color:#bcd0d7}main{max-width:1100px;margin:auto;padding:20px 14px}.panel,.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:18px}.panel{box-shadow:0 3px 0 #e4eaeb}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:13px;border:1px solid #adbec6;border-radius:10px;font-size:1rem}.row button,button{border:1px solid var(--l);border-radius:10px;background:#fff;padding:11px 14px;min-height:44px;font-weight:650;color:#203b48}.row button{background:var(--g);color:#fff;border-color:var(--g)}#status{color:var(--m);font-size:.88rem;margin:9px 0 0}.bad{color:#a22!important}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.chip{display:flex;align-items:center;background:#fff;border:1px solid var(--l);border-radius:9px}.chip a{padding:9px 10px;color:var(--g);text-decoration:none;font-weight:700}.chip button{border:0;padding:6px 9px;background:transparent}.card{border:2px solid var(--g)}.top{display:flex;justify-content:space-between;gap:10px}.top h2{margin:0;font-size:1.8rem}.badge{background:#e4f3eb;color:#155f4a;padding:7px 10px;border-radius:8px;height:max-content}.facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.facts span{background:#f0f4f5;padding:7px 10px;border-radius:6px}.loc{color:var(--m)}details{margin-top:14px;border-top:1px solid var(--l)}summary{cursor:pointer;padding:14px 0;font-weight:700}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 8px;text-align:left}tr:nth-child(even){background:#f4f7f8}.empty{text-align:center;color:var(--m);padding:45px 15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}footer{max-width:1100px;margin:auto;padding:18px 14px 30px;color:var(--m);font-size:.8rem}@media(max-width:620px){header{padding:16px}.row{flex-wrap:wrap}.row button{flex:1}.card{padding:14px}.top h2{font-size:1.55rem}}</style></head><body><header><div><h1>Этажи</h1><p>Луговой переулок дом 1</p></div></header><main><section class="panel"><h2>Найдите квартиру</h2><div class="row"><input id="q" inputmode="numeric" placeholder="Например: 13, 292, 475–480"><button id="add">Добавить</button></div><p id="status">3 подъезда · 17 этажей · 711 квартир</p><div id="chips" class="chips"></div><div class="actions"><button id="clear">Очистить</button><button id="share">Поделиться</button></div></section><section id="out"><div class="empty">Введите номер квартиры — покажу подъезд, этаж, расположение и весь стояк.</div></section></main><footer>© 2026 Прудников Евгений Сергеевич · Веб-версия «Этажи»</footer><script>const $=s=>document.querySelector(s),KEY='etazhi-selection-v1';let sel=[];function apartment(n){if(!Number.isInteger(n)||n<1||n>711)throw Error('Квартиры — от 1 до 711.');let local=(n-1)%237,e=Math.floor((n-1)/237)+1,f=local<13?1:Math.floor((local-13)/14)+2,p=local<13?local+1:(local-13)%14+1,r=f===1?(p===13?3:p<=2?2:1):([1,2,13,14].includes(p)?2:1),loc=r>1?'Со стороны Пятёрочки':p===3?'Левое крыло':p===12?'Правое крыло':'Со стороны детской площадки';return{n,e,f,p,r,loc,st:f===1&&p===13?[13,14]:[p]}}function numberAt(e,f,p){return(e-1)*237+1+(f===1?Math.min(p,13)-1:13+(f-2)*14+p-1)}function rows(n){let a=apartment(n);return Array.from({length:17},(_,i)=>({f:17-i,nums:[...new Set(a.st.map(p=>numberAt(a.e,17-i,p)))]}))}function parse(t){t=t.trim().replace(/\s*[-–—]\s*/g,'-');if(!t)throw Error('Введите номер квартиры.');let a=[];for(let x of t.split(/[,;\s]+/).filter(Boolean)){if(!/^\d{1,3}(-\d{1,3})?$/.test(x))throw Error('Пример: 13, 292, 475–480.');let [lo,hi=lo]=x.split('-').map(Number);if(lo<1||hi>711||lo>hi)throw Error('Допустимы квартиры 1–711.');for(let i=lo;i<=hi;i++)a.push(i)}return[...new Set(a)]}function save(){localStorage.setItem(KEY,JSON.stringify(sel))}function render(){let c=$('#chips'),o=$('#out');c.innerHTML=sel.map(n=>`<div class="chip"><a href="#apt-${n}">№${n}</a><button data-x="${n}">×</button></div>`).join('');o.innerHTML=sel.length?sel.map(n=>{let a=apartment(n);return`<article class="card" id="apt-${n}"><div class="top"><h2>Квартира №${n}</h2><span class="badge">${a.r}-комнатная</span></div><div class="facts"><span>Подъезд <b>${a.e}</b></span><span>Этаж <b>${a.f}</b> из 17</span></div><p class="loc">${a.loc}</p><details><summary>Квартиры по стояку${a.st.length===2?' · 2 ветви':''}</summary><table><tbody>${rows(n).map(x=>`<tr><th>${x.f} этаж</th><td>${x.nums.map(v=>'№'+v).join(' / ')}</td></tr>`).join('')}</tbody></table></details></article>`}).join(''):'<div class="empty">Введите номер квартиры — покажу подъезд, этаж, расположение и весь стояк.</div>';save()}function add(){try{let ns=parse($('#q').value);sel=[...new Set([...sel,...ns])];$('#q').value='';$('#status').textContent='Добавлено. Выбрано: '+sel.length;$('#status').classList.remove('bad');render()}catch(e){$('#status').textContent=e.message;$('#status').classList.add('bad')}}$('#add').onclick=add;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')add()});document.addEventListener('click',e=>{let b=e.target.closest('[data-x]');if(b){sel=sel.filter(n=>n!=b.dataset.x);render()}});$('#clear').onclick=()=>{sel=[];render();$('#status').textContent='Список очищен.'};$('#share').onclick=async()=>{let u=new URL(location.href);u.hash='q='+sel.join(',');try{if(navigator.share)await navigator.share({title:'Этажи · Луговой переулок дом 1',url:u.href});else{await navigator.clipboard.writeText(u.href);$('#status').textContent='Ссылка скопирована.'}}catch{}};function restore(){let q=new URLSearchParams(location.hash.slice(1)).get('q');try{sel=q?parse(q):JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(sel))sel=[]}catch{sel=[]}render()}restore();window.addEventListener('hashchange',restore);</script></body></html>
